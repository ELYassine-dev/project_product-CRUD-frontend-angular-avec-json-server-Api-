<div class="container">
  <div class="card">

    <div class="card-header">
      <div class="card-title">Products List</div>
    </div>

    <div class="card-body">
      <input type="text"
             class="p-1 w-25"
             [(ngModel)]="this.appstate.productstate.keyword"
             (keyup.enter)="searchproducts()">

      <button (click)="searchproducts()"
              class="btn btn-outline-success ms-1">
        <i class="bi bi-search"></i>
      </button>
    </div>

    <div class="table-responsive">
      <table class="table">
        <thead>
        <tr>
          <th>Name</th>
          <th>PRICE</th>
          <th>CHECKED</th>
          <th>ACTIONS</th>
        </tr>
        </thead>

        <tbody>
          @for (p of this.appstate.productstate.product; track p.id) {
            <tr>
              <td>{{p.name}}</td>
              <td>{{p.price}}</td>

              <td>
                <button class="btn btn-outline-success" (click)="checkpro(p)">
                  <i class="bi"
                     [class]="p.checked ? 'bi-check-circle-fill text-success' : 'bi-circle'"></i>
                </button>
              </td>

              <td>
                <button (click)="handledelete(p)"
                        class="btn btn-outline-danger">
                  <i class="bi bi-trash"></i>
                </button>

                <button (click)="editproduct(p)"
                        class="btn btn-outline-info ms-1">
                  <i class="bi bi-pen"></i>
                </button>
              </td>
            </tr>
          }
        </tbody>
      </table>

      <div class="d-flex justify-content-center mt-3">

        <button class="btn btn-primary me-2"
                (click)="prevPage()"
                [disabled]="this.appstate.productstate.page === 1">
          Previous
        </button>

        <span class="align-self-center">
    Page {{this.appstate.productstate.page}} / {{this.appstate.productstate.totalpages}}
  </span>

        <button class="btn btn-primary ms-2"
                (click)="nextPage()"
                [disabled]="this.appstate.productstate.page === this.appstate.productstate.totalpages - 1">
          Next
        </button>

      </div>













    </div>

  </div>
</div>

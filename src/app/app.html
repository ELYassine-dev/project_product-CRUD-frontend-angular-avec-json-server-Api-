
<div class="container mt-2">
  <nav class="mt-3">
        @for(act of activite;track act){
          <button
            (click)="activate(act)"
            routerLink="{{act.route}}"
            [class]="act==currentactivate?'btn btn-success':'btn btn-outline-success'"
            class="ms-2">
            {{act.title}}
            <i class="{{act.icon}}"></i>
          </button>
        }
  </nav>

<hr>
  <router-outlet></router-outlet>


</div>


<div class="container mt-2 navbar">
  <nav class="mt-3 nav nav-pills" >
    @for(act of activite;track act){

       <button
         (click)="activate(act)"
         routerLink="{{act.route}}"
         [class]="act==currentactivate?'btn btn-success':'btn btn-outline-success'"
         class="ms-2">
         {{act.title}}
         <i class="{{act.icon}}"></i>
       </button>


    }
<!--    @if(appstate.productstate.status=="loading"){-->
      @if(loadingservice.isloading |async){
      <div class="spinner-border text-primary m-1" role="status">
        </div>
    }
<!--    <ul class="nav nav-pills">-->
      @if(appstate.authstate.isAuthenticate){
     <li>
      <span>{{appstate.authstate.username}}</span>
       <button class="btn btn-success ms-1" (click)="logout()">Logout</button>
     </li>
      }
        <li>
          @if(!appstate.authstate.isAuthenticate){
            <li>
              <button class="btn btn-success ms-2" (click)="login()">Login</button>
            <li>
          }
        </li>

<!--    </ul>-->
          </nav>
        </div>

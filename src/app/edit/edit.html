<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">

          <div class="card shadow p-4">

          <h3 class="text-center mb-4">Update Product</h3>

<!--                    @if(productformgroup){-->

        <form [formGroup]="productformgroup" (ngSubmit)="updateprod()">
          <div class="mb-3">
          <label>Product Id </label>
            <input type="text" formControlName="id" >
          </div>
          <!-- Name -->
          <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" class="form-control"
                   name="name"
                   placeholder="Enter product name"
                   required     formControlName="name"    >

          </div>

          <!-- Price -->
          <div class="mb-3">
            <label class="form-label">Price</label>
            <input
              type="number"
              class="form-control"
              name="price"
              placeholder="Enter price"
              required        formControlName="price"      >
            <div class="text-danger">
                 </div>
          </div>

          <!-- Checkbox -->
          <div class="form-check mb-3">
            <input type="checkbox"
                   class="form-check-input"
                   id="available"
                   name="available"   formControlName="checked"
                    >

            <label class="form-check-label" for="available">
              Available
            </label>
          </div>

          <!-- Button -->
          <button type="submit"
                  [disabled]="productformgroup.invalid"
                  class="btn btn-success w-100" >
            Update Product
          </button>

        </form>
<!--                    }-->
          </div>
           </div>
  </div>
</div>
